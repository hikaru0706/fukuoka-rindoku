<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>送信しました｜福岡市 哲学書・心理学輪読会</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Noto+Serif+JP:wght@700&display=swap" rel="stylesheet">
<style>
:root { --bg: #f7f3ec; --ink: #2a2622; --muted: #6b635a; --accent: #7a3e2c; --accent-ink: #fff; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #1b1916; --ink: #ece6dc; --muted: #a99f92; --accent: #d99a7f; --accent-ink: #1b1916; }
}
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
  font-family: "Noto Sans JP", system-ui, sans-serif; line-height: 1.9; text-align: center; padding: 20px; }
h1 { font-family: "Noto Serif JP", serif; font-size: 26px; }
p { color: var(--muted); }
a { display: inline-block; margin-top: 20px; background: var(--accent); color: var(--accent-ink);
  padding: 12px 28px; border-radius: 999px; text-decoration: none; font-weight: 700; }
</style>
</head>
<body>
  <div>
    <h1>送信しました</h1>
    <p>お問い合わせありがとうございます。<br>内容を確認して、メールでご連絡します。</p>
    <a href="./">トップに戻る</a>
  </div>
</body>
</html>
